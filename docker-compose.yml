services:
  ssh-mcp:
    build: .
    image: ssh-mcp:latest
    platform: linux/amd64
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      # Bind all interfaces inside the container so the published port works.
      # `ports:` above already restricts exposure to the host; put this behind
      # a proxy / firewall and set SSH_MCP_MCP_AUTH_TOKEN in .env.
      MCP_HOST: 0.0.0.0
    restart: unless-stopped
